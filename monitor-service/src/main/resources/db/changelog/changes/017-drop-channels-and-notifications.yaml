databaseChangeLog:
  - changeSet:
      id: 017-drop-channels-and-notifications
      author: awesoma31
      comment: >-
        Channels and notifications move to notification-service and its own database;
        monitor-service announces incidents to it instead of writing notifications itself.
        Rolling back restores the tables as changesets 011 and 012 created them, empty.
      changes:
        - dropTable:
            tableName: notifications
        - dropTable:
            tableName: channels
      rollback:
        - sql:
            sql: >-
              CREATE TABLE channels (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY CONSTRAINT pk_channels PRIMARY KEY,
                project_id BIGINT NOT NULL
                  CONSTRAINT fk_channels_project REFERENCES projects (id) ON DELETE CASCADE,
                type VARCHAR(20) NOT NULL
                  CONSTRAINT ck_channels_type CHECK (type IN ('EMAIL', 'WEBHOOK', 'TELEGRAM')),
                target VARCHAR(512) NOT NULL
                  CONSTRAINT ck_channels_target_not_blank CHECK (length(trim(target)) > 0),
                enabled BOOLEAN NOT NULL DEFAULT TRUE,
                CONSTRAINT uk_channels_project_type_target UNIQUE (project_id, type, target)
              );
              CREATE TABLE notifications (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY CONSTRAINT pk_notifications PRIMARY KEY,
                incident_id BIGINT NOT NULL
                  CONSTRAINT fk_notifications_incident REFERENCES incidents (id) ON DELETE CASCADE,
                channel_id BIGINT NOT NULL
                  CONSTRAINT fk_notifications_channel REFERENCES channels (id) ON DELETE CASCADE,
                sent_at TIMESTAMP WITH TIME ZONE,
                status VARCHAR(20) NOT NULL DEFAULT 'PENDING'
                  CONSTRAINT ck_notifications_status CHECK (status IN ('PENDING', 'SENT', 'FAILED')),
                attempts INTEGER NOT NULL DEFAULT 0
                  CONSTRAINT ck_notifications_attempts CHECK (attempts >= 0),
                CONSTRAINT ck_notifications_sent_at_matches_status
                  CHECK ((status = 'SENT' AND sent_at IS NOT NULL)
                      OR (status <> 'SENT' AND sent_at IS NULL))
              )
