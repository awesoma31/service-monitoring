databaseChangeLog:
  - changeSet:
      id: 002-create-projects
      author: awesoma31
      comment: Projects group monitors and notification channels
      changes:
        - createTable:
            tableName: projects
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_projects
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_projects_owner
                    references: users(id)
                    deleteCascade: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_projects_slug
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_projects_owner_id
            tableName: projects
            columns:
              - column:
                  name: owner_id
        - sql:
            sql: >-
              ALTER TABLE projects
                ADD CONSTRAINT ck_projects_name_not_blank
                  CHECK (length(trim(name)) > 0),
                ADD CONSTRAINT ck_projects_slug_format
                  CHECK (slug ~ '^[a-z0-9]+(-[a-z0-9]+)*$')
      rollback:
        - dropTable:
            tableName: projects
