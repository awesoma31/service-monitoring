databaseChangeLog:
  - changeSet:
      id: 014-rename-users-password
      author: awesoma31
      comment: >-
        Lab 1 stores passwords as given, so the column no longer holds a hash and its name
        should not claim otherwise. Hashing returns together with authentication in lab 3.
      changes:
        - renameColumn:
            tableName: users
            oldColumnName: password_hash
            newColumnName: password
            columnDataType: VARCHAR(255)
      rollback:
        - renameColumn:
            tableName: users
            oldColumnName: password
            newColumnName: password_hash
            columnDataType: VARCHAR(255)
