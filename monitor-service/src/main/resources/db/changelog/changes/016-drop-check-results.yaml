databaseChangeLog:
  - changeSet:
      id: 016-drop-check-results
      author: awesoma31
      comment: >-
        The check history moves to check-service and its own database, so monitor-service
        keeps only what it acts on: last_checked_at and the incidents. Rolling back restores
        the table as changesets 007 and 008 created it, without the moved rows.
      changes:
        - dropTable:
            tableName: check_results
      rollback:
        - sql:
            sql: >-
              CREATE TABLE check_results (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY
                  CONSTRAINT pk_check_results PRIMARY KEY,
                monitor_id BIGINT NOT NULL
                  CONSTRAINT fk_check_results_monitor REFERENCES monitors (id) ON DELETE CASCADE,
                checked_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT now(),
                result VARCHAR(20) NOT NULL
                  CONSTRAINT ck_check_results_result
                    CHECK (result IN ('SUCCESS', 'TIMEOUT', 'BAD_STATUS', 'CONNECTION_ERROR')),
                response_ms INTEGER
                  CONSTRAINT ck_check_results_response_ms
                    CHECK (response_ms IS NULL OR response_ms >= 0),
                http_status INTEGER
                  CONSTRAINT ck_check_results_http_status
                    CHECK (http_status IS NULL OR http_status BETWEEN 100 AND 599),
                error_message VARCHAR(1000)
              );
              CREATE INDEX idx_check_results_monitor_checked_at
                ON check_results (monitor_id, checked_at DESC)
