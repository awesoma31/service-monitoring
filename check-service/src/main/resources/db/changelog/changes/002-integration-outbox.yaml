databaseChangeLog:
  - changeSet:
      id: 002-integration-outbox
      author: codex
      changes:
        - sql:
            sql: >-
              CREATE TABLE integration_outbox (
                id BIGSERIAL PRIMARY KEY,
                event_id UUID NOT NULL UNIQUE,
                transport VARCHAR(8) NOT NULL,
                payload TEXT NOT NULL,
                created_at TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              CREATE TABLE integration_inbox (
                event_id UUID PRIMARY KEY,
                processed_at TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              CREATE TABLE deleted_monitors (
                monitor_id BIGINT PRIMARY KEY
              );
      rollback:
        - sql:
            sql: DROP TABLE deleted_monitors; DROP TABLE integration_inbox; DROP TABLE integration_outbox;
