databaseChangeLog:
  - changeSet:
      id: 001-create-check-results
      author: awesoma31
      comment: >-
        One row per probe. monitor_id refers to a monitor in monitor-service, which owns a
        separate database, so it is a plain column rather than a foreign key; the history
        of a deleted monitor is removed by that service through the internal API.
      changes:
        - createTable:
            tableName: check_results
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_check_results
              - column:
                  name: monitor_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: checked_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: result
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: response_ms
                  type: INTEGER
              - column:
                  name: http_status
                  type: INTEGER
              - column:
                  name: error_message
                  type: VARCHAR(1000)
        - sql:
            sql: >-
              ALTER TABLE check_results
                ADD CONSTRAINT ck_check_results_result
                  CHECK (result IN ('SUCCESS', 'TIMEOUT', 'BAD_STATUS', 'CONNECTION_ERROR')),
                ADD CONSTRAINT ck_check_results_response_ms
                  CHECK (response_ms IS NULL OR response_ms >= 0),
                ADD CONSTRAINT ck_check_results_http_status
                  CHECK (http_status IS NULL OR http_status BETWEEN 100 AND 599)
        - sql:
            # History is read per monitor, newest first; DESC is not expressible in createIndex.
            sql: >-
              CREATE INDEX idx_check_results_monitor_checked_at
                ON check_results (monitor_id, checked_at DESC)
      rollback:
        - dropTable:
            tableName: check_results
