spring:
  application:
    name: config-server
  profiles:
    # Configuration is served from files packaged with this module, not from a git remote.
    active: native
  cloud:
    config:
      server:
        native:
          # The shared files, then the folder of the requesting service, which takes precedence.
          search-locations: ${CONFIG_REPO_LOCATION:classpath:/config-repo}/,${CONFIG_REPO_LOCATION:classpath:/config-repo}/{application}/
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9092,kafka-3:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000

config:
  changes:
    # Needs Kafka and a repository on disk: see docker-compose.kafka.yml.
    enabled: ${CONFIG_CHANGES_ENABLED:false}
    repository-path: ${CONFIG_REPO_PATH:/config-repo}
    poll-interval: PT5S

server:
  port: ${CONFIG_SERVER_PORT:8888}

management:
  endpoints:
    web:
      exposure:
        include: health
