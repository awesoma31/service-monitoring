spring:
  application:
    name: config-server
  profiles:
    # Configuration is served from files packaged with this module, not from a git remote.
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:classpath:/config-repo}

server:
  port: ${CONFIG_SERVER_PORT:8888}

management:
  endpoints:
    web:
      exposure:
        include: health
