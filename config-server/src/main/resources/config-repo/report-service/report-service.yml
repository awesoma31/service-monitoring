spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Liquibase; Hibernate only verifies it matches the entities.
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      # MB is 2^20 bytes. The request limit leaves room for the part boundaries and headers.
      max-file-size: ${REPORT_MAX_FILE_SIZE:10MB}
      max-request-size: ${REPORT_MAX_REQUEST_SIZE:12MB}
      # Larger parts go to a temporary file that is removed after the request.
      file-size-threshold: 1MB

server:
  port: ${APP_PORT:8085}
  tomcat:
    # Past this, an oversized upload is cut off instead of being read to answer 413.
    max-swallow-size: ${REPORT_MAX_REQUEST_SIZE:12MB}

report:
  max-file-size: ${REPORT_MAX_FILE_SIZE:10MB}
  upload-timeout: ${REPORT_UPLOAD_TIMEOUT:PT10M}
  max-page-size: 50
  # An Idempotency-Key of a deleted report stays taken this long.
  idempotency-tombstone-ttl: ${REPORT_IDEMPOTENCY_TOMBSTONE_TTL:PT24H}
  # Objects younger than this are never taken for orphans: a writer may still be at work.
  reconciliation-grace: ${REPORT_RECONCILIATION_GRACE:PT15M}
  generation:
    max-period-days: ${REPORT_GENERATION_MAX_PERIOD_DAYS:31}
    max-monitors: ${REPORT_GENERATION_MAX_MONITORS:100}
    max-source-rows: ${REPORT_GENERATION_MAX_SOURCE_ROWS:100000}
    page-size: 50
    timeout: ${REPORT_GENERATION_TIMEOUT:PT5M}
    concurrency: ${REPORT_GENERATION_CONCURRENCY:2}
    max-attempts: ${REPORT_GENERATION_MAX_ATTEMPTS:3}
    retry-delay: ${REPORT_GENERATION_RETRY_DELAY:PT30S}
    lease-duration: ${REPORT_GENERATION_LEASE_DURATION:PT1M}
  jobs:
    enabled: ${REPORT_JOBS_ENABLED:true}
    poll-interval: PT2S
    recovery-interval: PT30S
    cleanup-interval: PT30S
    reconciliation-interval: PT10M

springdoc:
  swagger-ui:
    path: /swagger-ui.html

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    bucket: ${MINIO_BUCKET:reports}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    connect-timeout: ${MINIO_CONNECT_TIMEOUT:PT5S}
    # Per read or write of the stream, not for the whole transfer.
    io-timeout: ${MINIO_IO_TIMEOUT:PT1M}

config:
  updates:
    # A change of the shared file restarts everything; the services go one after another.
    restart-delay: PT80S
