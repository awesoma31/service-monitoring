server:
  port: ${GATEWAY_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          # More specific paths first: everything not claimed by another service goes to
          # monitor-service.
          routes:
            - id: check-service
              uri: lb://check-service
              order: 0
              predicates:
                - Path=/api/v1/monitors/*/results
            - id: monitor-service
              uri: lb://monitor-service
              order: 100
              predicates:
                - Path=/api/v1/**
