server:
  port: ${GATEWAY_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          # More specific paths first: everything not claimed by another service goes to
          # monitor-service.
          routes:
            - id: check-service
              uri: lb://check-service
              order: 0
              predicates:
                - Path=/api/v1/monitors/*/results
              filters:
                # An unreachable service answers 503 at once instead of a raw load-balancer
                # error, and a failing one is left alone while its circuit is open.
                - name: CircuitBreaker
                  args:
                    name: check-service
                    fallbackUri: forward:/fallback/check-service
            - id: notification-service
              uri: lb://notification-service
              order: 0
              predicates:
                - Path=/api/v1/projects/*/channels,/api/v1/channels/**,/api/v1/incidents/*/notifications
              filters:
                # An unreachable service answers 503 at once instead of a raw load-balancer
                # error, and a failing one is left alone while its circuit is open.
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackUri: forward:/fallback/notification-service
            - id: monitor-service
              uri: lb://monitor-service
              order: 100
              predicates:
                - Path=/api/v1/**
              filters:
                # An unreachable service answers 503 at once instead of a raw load-balancer
                # error, and a failing one is left alone while its circuit is open.
                - name: CircuitBreaker
                  args:
                    name: monitor-service
                    fallbackUri: forward:/fallback/monitor-service
