databaseChangeLog:
  - changeSet:
      id: user-001-schema
      author: nifreebie
      changes:
        - sql:
            sql: |
              CREATE TABLE users (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                email VARCHAR(255) NOT NULL UNIQUE,
                password_hash VARCHAR(255) NOT NULL,
                full_name VARCHAR(255) NOT NULL,
                status VARCHAR(20) NOT NULL DEFAULT 'ACTIVE' CHECK (status IN ('ACTIVE','INACTIVE','BLOCKED')),
                role VARCHAR(20) NOT NULL DEFAULT 'VIEWER' CHECK (role IN ('SUPERVISOR','OPERATOR','VIEWER')),
                deleted BOOLEAN NOT NULL DEFAULT FALSE,
                CONSTRAINT ck_users_email_shape CHECK (email LIKE '%_@_%.__%'),
                CONSTRAINT ck_users_full_name_not_blank CHECK (length(trim(full_name)) > 0)
              );
              CREATE TABLE service_clients (
                id VARCHAR(100) PRIMARY KEY,
                secret_hash VARCHAR(255) NOT NULL,
                enabled BOOLEAN NOT NULL DEFAULT TRUE
              );
              CREATE TABLE user_imports (source VARCHAR(100) PRIMARY KEY, imported_count BIGINT NOT NULL);
      rollback:
        - sql:
            sql: DROP TABLE user_imports; DROP TABLE service_clients; DROP TABLE users;
