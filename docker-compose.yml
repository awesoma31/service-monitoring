# Start order: postgres → config-server → eureka-server → services → gateway.
# Only the gateway (API) and the Eureka dashboard are published on the host.
x-healthcheck: &actuator-health
  interval: 5s
  timeout: 5s
  retries: 30

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-monitoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitoring}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitoring} -d ${POSTGRES_DB:-monitoring}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the databases of the other services; the monitor-service one is POSTGRES_DB.
  postgres-init:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-monitoring}
    volumes:
      - ./docker/postgres/create-databases.sql:/create-databases.sql:ro
    command: >-
      psql -h postgres -U ${POSTGRES_USER:-monitoring} -d ${POSTGRES_DB:-monitoring}
      -v ON_ERROR_STOP=1 -f /create-databases.sql

  config-server:
    build:
      context: .
      args:
        MODULE: config-server
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP" ]
      <<: *actuator-health

  eureka-server:
    build:
      context: .
      args:
        MODULE: eureka-server
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP" ]
      <<: *actuator-health

  monitor-service:
    build:
      context: .
      args:
        MODULE: monitor-service
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_FAIL_FAST: "true"
      EUREKA_URL: http://eureka-server:8761/eureka
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-monitoring}
      DB_USER: ${POSTGRES_USER:-monitoring}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-monitoring}
      APP_PORT: 8080
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP" ]
      <<: *actuator-health

  check-service:
    build:
      context: .
      args:
        MODULE: check-service
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_FAIL_FAST: "true"
      EUREKA_URL: http://eureka-server:8761/eureka
      DB_R2DBC_URL: r2dbc:postgresql://postgres:5432/check_db
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/check_db
      DB_USER: ${POSTGRES_USER:-monitoring}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-monitoring}
      APP_PORT: 8080
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP" ]
      <<: *actuator-health

  gateway:
    build:
      context: .
      args:
        MODULE: gateway
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      monitor-service:
        condition: service_healthy
      check-service:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      CONFIG_FAIL_FAST: "true"
      EUREKA_URL: http://eureka-server:8761/eureka
      GATEWAY_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP" ]
      <<: *actuator-health

volumes:
  postgres-data:
