databaseChangeLog:
  - changeSet:
      id: 003-create-project-members
      author: awesoma31
      comment: Many-to-many between projects and users carrying the member role
      changes:
        - createTable:
            tableName: project_members
            columns:
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_project_members_project
                    references: projects(id)
                    deleteCascade: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_project_members_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: joined_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: project_members
            columnNames: project_id, user_id
            constraintName: pk_project_members
        - createIndex:
            indexName: idx_project_members_user_id
            tableName: project_members
            columns:
              - column:
                  name: user_id
        - sql:
            sql: >-
              ALTER TABLE project_members
                ADD CONSTRAINT ck_project_members_role
                  CHECK (role IN ('OWNER', 'EDITOR', 'VIEWER'))
      rollback:
        - dropTable:
            tableName: project_members
