spring:
  application:
    name: service-monitoring
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${APP_PORT:8080}

checker:
  enabled: ${CHECKER_ENABLED:true}
  interval-ms: ${CHECKER_INTERVAL_MS:15000}
  batch-size: ${CHECKER_BATCH_SIZE:50}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
