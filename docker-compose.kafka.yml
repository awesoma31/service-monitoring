# Optional overlay: docker compose -f docker-compose.yml -f docker-compose.kafka.yml up
# Kafka is deliberately internal to the Compose network; use `docker compose exec` for its CLI.
x-kafka-common: &kafka-common
  image: apache/kafka:4.2.2
  environment: &kafka-environment
    CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 30s

services:
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.2.2
    entrypoint: ["/bin/bash", "/opt/kafka-init/init-topics.sh"]
    volumes:
      - ./docker/kafka/init-topics.sh:/opt/kafka-init/init-topics.sh:ro
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: on-failure

  monitor-service:
    depends_on:
      kafka-init:
        condition: service_completed_successfully
  check-service:
    depends_on:
      kafka-init:
        condition: service_completed_successfully
  notification-service:
    depends_on:
      kafka-init:
        condition: service_completed_successfully
  report-service:
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
