databaseChangeLog:
  - changeSet:
      id: 002-create-notifications
      author: awesoma31
      comment: >-
        One notification per channel and incident event. incident_id refers to an incident in
        monitor-service and is a plain column; channel_id is local and cascades.
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_notifications
              - column:
                  name: incident_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: channel_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_notifications_channel
                    references: channels(id)
                    deleteCascade: true
              - column:
                  name: sent_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_notifications_incident_id
            tableName: notifications
            columns:
              - column:
                  name: incident_id
        - sql:
            sql: >-
              ALTER TABLE notifications
                ADD CONSTRAINT ck_notifications_status CHECK (status IN ('PENDING', 'SENT', 'FAILED')),
                ADD CONSTRAINT ck_notifications_attempts CHECK (attempts >= 0),
                ADD CONSTRAINT ck_notifications_sent_at_matches_status
                  CHECK ((status = 'SENT' AND sent_at IS NOT NULL)
                      OR (status <> 'SENT' AND sent_at IS NULL))
      rollback:
        - dropTable:
            tableName: notifications
