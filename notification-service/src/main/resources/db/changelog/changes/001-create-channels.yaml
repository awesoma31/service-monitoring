databaseChangeLog:
  - changeSet:
      id: 001-create-channels
      author: awesoma31
      comment: >-
        Where a project wants its alerts delivered. project_id refers to a project in
        monitor-service, which owns another database, so it is a plain column; the channels
        of a deleted project are removed by that service through the internal API.
      changes:
        - createTable:
            tableName: channels
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_channels
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: target
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: channels
            columnNames: project_id, type, target
            constraintName: uk_channels_project_type_target
        - sql:
            sql: >-
              ALTER TABLE channels
                ADD CONSTRAINT ck_channels_type CHECK (type IN ('EMAIL', 'WEBHOOK', 'TELEGRAM')),
                ADD CONSTRAINT ck_channels_target CHECK (length(trim(target)) > 0)
      rollback:
        - dropTable:
            tableName: channels
